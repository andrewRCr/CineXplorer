name: Atomic Commit Workflow
command: |
  echo "=== ATOMIC COMMIT WORKFLOW ==="
  echo "1. Check Status:"
  git status
  echo ""
  echo "2. Review Changes:"
  git --no-pager diff --stat
  echo ""
  echo "3. Task Documentation Check:"
  echo "Before committing, verify:"
  echo "  - All subtasks [x] → parent should be [x]"
  echo "  - Task progress matches commit content"
  echo "  - Commit messages reference correct tasks"
  echo ""
  echo "4. Commit Planning Guide:"
  echo "Group changes logically:"
  echo "  • Core functionality (feat)"
  echo "  • Config/Infrastructure (config)"
  echo "  • Tests (test)"
  echo "  • Documentation (docs)"
  echo "  • Code formatting (style)"
  echo "  • Dependencies (chore)"
  echo "  • Cleanup/refactoring (refactor)"
  echo ""
echo "5. Commit Format:"
echo "[type](feature-scope): Brief description"
echo "  - Use feature name for multi-task work (logging-system)"
echo "  - Use component for single changes (middleware, database)"
echo "  - Include task context: Complete logging-system task 2.0"
echo "  - Detailed change 1"
echo "  - Detailed change 2"
echo "  - Impact/rationale"
  echo ""
  echo "6. Ready to commit! Use: git add [files] && git commit"
  echo "7. When done, verify: git log --oneline -5"
description: Break changes into logical, atomic commits with clear messages
