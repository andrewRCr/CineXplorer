---
name: Test / Lint

on: [push, pull_request]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: cinexplorer-backend
          tags: |
            type=sha,prefix={{branch}}-

      - name: Build and cache backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Create .env file
        run: |
          echo "POSTGRES_DB=cinexplorer" > backend/config/.env
          echo "POSTGRES_USER=postgres" >> backend/config/.env
          echo "POSTGRES_PASSWORD=postgres" >> backend/config/.env
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> backend/config/.env
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> backend/config/.env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> backend/config/.env
          echo "ZEPTOMAIL_API_KEY=${{ secrets.ZEPTOMAIL_API_KEY }}" >> backend/config/.env
          # FRONTEND_URL will be added when production domain is available
          # echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend/config/.env

      - name: Start services
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-ci
          CI: true
        run: |
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.ci.yml up -d dev-db backend
          # Wait for database to be ready
          docker compose exec backend python manage.py wait_for_db

      - name: Run backend tests
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-ci
        run: |
          docker compose exec backend python manage.py test --keepdb --settings=config.settings_test

      - name: Run backend lint
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-ci
        run: |
          docker compose exec backend flake8

  frontend:
    name: Frontend Tests & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check for OpenAPI schema
        working-directory: frontend
        run: |
          if [ -f openapi.json ]; then
            echo "OpenAPI schema found, will validate types"
            echo "VALIDATE_TYPES=true" >> $GITHUB_ENV
          else
            echo "No OpenAPI schema found, skipping type generation"
            echo "VALIDATE_TYPES=false" >> $GITHUB_ENV
          fi

      - name: Generate types from schema (if available)
        if: env.VALIDATE_TYPES == 'true'
        working-directory: frontend
        run: npm run ci:generate-types

      - name: TypeScript type checking
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build verification
        working-directory: frontend
        run: npm run build
