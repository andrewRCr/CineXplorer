services:
  backend:
    build:
      context: ./backend
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
      - ./certs/key.pem:/app/key.pem
      - ./certs/cert.pem:/app/cert.pem
    env_file:
      - ./backend/config/.env
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver_plus 0.0.0.0:8000 --cert-file /app/cert.pem --key-file /app/key.pem"
    environment:
      - DB_HOST=dev-db
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-k",
          "--fail",
          "https://localhost:8000/api/health-check/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dev-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/frontend/src # bind local source files to container (without node_modules)
      - ./certs/key.pem:/app/certs/key.pem
      - ./certs/cert.pem:/app/certs/cert.pem

    depends_on:
      - backend

  dev-db:
    image: postgres:17.5-alpine
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      # These credentials are for local development only. The backend service connects to its
      # database using credentials from its own .env file, not these.
      - POSTGRES_DB=devDB
      - POSTGRES_USER=devUser
      - POSTGRES_PASSWORD=devPassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devUser -d devDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs/cert.pem:/etc/caddy/cert.pem
      - ./certs/key.pem:/etc/caddy/key.pem
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  dev-db-data:
