# CineXplorer Backend - Python Project Configuration

[tool.ruff]
# Target Python 3.13
target-version = "py313"

# Line length to match existing standard
line-length = 99

# Exclude patterns (matches .flake8 config)
exclude = [
    "migrations",
    "__pycache__",
    "manage.py",
    ".git",
    ".venv",
    "env",
    "venv",
    ".pytest_cache",
    ".tox",
]

[tool.ruff.lint]
# Enable rule categories
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "RUF",   # Ruff-specific rules
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "SIM",   # flake8-simplify
    "ANN401", # Explicit typing.Any detection (type safety quality gate)
    "D",     # pydocstyle: docstring conventions (Google style, below)
    "C90",   # McCabe complexity
    "BLE",   # Blind exception catches
    "S",     # Security checks
    "T20",   # Print statements
    "TRY400", # Exception logging with traceback
    "PGH",   # Blanket suppressions
    "RET",   # Return consistency
    "ERA",   # Commented-out code
    "LOG",   # Logging practices
    "G201",  # Exception logging
]

# Ignore specific rules
ignore = [
    "D1",      # Missing docstrings: not every module, class and function needs one
    "DJ001",   # Django model without __str__ (not always needed)
    "RUF012",  # Mutable class attributes (Django/DRF/Pydantic Meta classes)
]

[tool.ruff.lint.mccabe]
# Maximum complexity (matches .flake8 max-complexity = 10)
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Google style: summary on the first line, then Args/Returns/Raises sections
convention = "google"

[tool.ruff.lint.isort]
# Django-aware import sorting
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]
# Test assertions and deliberately fake credentials are not runtime security boundaries.
"tests/**/*.py" = ["S101", "S105", "S106"]
"*/tests/**/*.py" = ["S101", "S105", "S106"]

# Typing.Any exceptions for justified external API boundaries
# Document why Any is needed at each external API boundary.
"apps/authentication/adapters.py" = ["ANN401"]  # Allauth library contracts
# JWT/session failures deliberately become unauthenticated results or fixed HTTP errors.
# Log only exception types: token/ORM failures can include private values. ANN401 is for
# third-party settings and OpenAPI contracts.
"apps/authentication/auth_ninja.py" = ["ANN401", "BLE001", "TRY400"]
"apps/core/services/metrics.py" = ["ANN401"]  # Monitoring system mixed-type labels
"apps/core/management/commands/export_openapi_schema.py" = ["ANN401"]  # OpenAPI schema dict
"apps/core/management/commands/wait_for_db.py" = ["N806", "ANN401"]  # ALL_CAPS OK, Django command args
"stubs/**/*.pyi" = ["ANN401"]  # Type stubs may use Any for external library contracts


# Registration, refresh and verification preserve safe failure responses even when an
# arbitrary identity/mail dependency fails; its text and traceback may contain PII.
"apps/authentication/services/authentication_service.py" = ["BLE001", "TRY400"]
# Blacklist writes are explicitly best effort during rotation, including unexpected
# dependency failures. Their exceptions can quote token/user data, so log only types.
"apps/authentication/utils.py" = ["BLE001", "TRY400"]
# Logging endpoints are best effort, including custom handler failures; client payloads
# and file-write exceptions must not reach a second log record or traceback.
"apps/core/api.py" = ["BLE001", "TRY400"]
# Diagnostic commands continue reporting when the dependency they exercise fails.
"apps/core/management/commands/test_logging.py" = ["BLE001"]
"apps/core/management/commands/test_tmdb_logging.py" = ["BLE001"]
"apps/core/management/commands/verify_logging_security.py" = ["BLE001"]
"apps/core/management/commands/verify_tmdb_logging.py" = ["BLE001"]
# Invalid-JSON exceptions contain response documents; report metadata without tracebacks.
"apps/core/services/base_api_client.py" = ["TRY400"]
# TRY400: invalid-JSON errors must not expose their response document in a traceback.
# ANN401: the raw external JSON remains dynamic before schema validation, preserving
# existing duck-typed diagnostics without introducing a new parsing policy.
"apps/core/services/tmdb_api_client.py" = ["TRY400", "ANN401"]
# Welcome mail is best effort across template and transport failures; errors can quote recipients.
"apps/core/services/email_service.py" = ["BLE001", "TRY400"]
# Mail configuration, conversion and transport failures count as unsent; their
# exception text can contain recipients or credentials, so only types are logged.
"apps/core/email_backend.py" = ["BLE001"]
# ValidationError embeds raw input, so validation logs use safe counts/types, never tracebacks.
"apps/core/services/validators.py" = ["TRY400"]
"apps/movie/services/tmdb_api_boundary/response_factories.py" = ["TRY400"]
# Redis connection exceptions can quote credentials; keep only their type in logs.
"apps/core/services/redis_client.py" = ["TRY400"]
"apps/movie/services/deduplication_tracker.py" = ["TRY400"]
# Optional cache storage must not prevent authoritative database access, regardless of backend.
# A backend/serialization exception may include private values, so log only its type.
"apps/movie/services/data_quality/filters.py" = ["BLE001", "TRY400"]
# One unexpected dependency failure must not abort the whole movie batch; HTTP errors may
# contain request URLs and credentials, so error logs exclude exception text and tracebacks.
"apps/movie/services/pipelines/batch.py" = ["BLE001", "TRY400"]
# Error-code literals are identifiers, not credentials.
"apps/core/schemas.py" = ["S105"]
# Bootstrap/fallback diagnostics must work before logging is reliable and go to stderr.
# ACCESS_TOKEN_NAME and REFRESH_TOKEN_NAME are cookie names, not token values.
"config/settings.py" = ["BLE001", "T201", "S105"]
# These are pre-configuration diagnostics and explicit terminal-report functions.
"config/logging.py" = ["T201"]
# Test-only database identity selection compares against deliberately dummy credentials.
"config/settings_test.py" = ["S105"]
# These provider fixtures intentionally use dummy token defaults, never production credentials.
"apps/authentication/tests/oauth_mocks.py" = ["S107"]
"apps/authentication/tests/test_helpers.py" = ["S107"]
# Shared test fixtures live outside tests/ and deliberately create users with fake passwords.
"apps/conftest.py" = ["S106"]
# These subprocesses use sys.executable and fixed programs with repository-owned test input;
# arguments are passed without a shell and never come from an application request.
"apps/core/tests/test_commands.py" = ["S603"]
"apps/core/tests/test_helpers.py" = ["S603"]

[tool.ruff.format]
# Use double quotes (Python default)
quote-style = "double"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Format docstrings
docstring-code-format = true

[tool.pytest.ini_options]
# Django settings module for tests
DJANGO_SETTINGS_MODULE = "config.settings_test"

# Test discovery patterns
testpaths = ["apps"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Additional options
addopts = [
    "-n", "auto",              # Parallel execution via pytest-xdist (5x speedup)
    "--maxprocesses", "4",     # Cap the workers: -n auto would start one per core
    "--reuse-db",              # Reuse test database (equivalent to --keepdb in manage.py test)
    "--import-mode=importlib", # Use importlib for module imports (modern approach)
    "--strict-markers",        # Raise error on unregistered markers
    "-ra",                     # Show extra test summary info for all except passed tests
    "--tb=short",              # Shorter traceback format
]

# Markers for categorizing tests
markers = [
    "enable_throttling: Enable throttling for specific tests (default: bypassed for speed)",
    "slow: Mark tests that take significant time to run",
]

# Warning filters
filterwarnings = [
    # Tests use default static storage without collecting assets into STATIC_ROOT.
    "ignore:No directory at.*/staticfiles/:UserWarning",
]

[tool.coverage.run]
# Source paths to measure (only application code)
source = ["apps"]

# Omit patterns - files that shouldn't be in coverage reports
omit = [
    "*/migrations/*",           # Django migrations (auto-generated)
    "*/tests/*",                # Test files themselves
    "*/test_*.py",              # Test files
    "*_test.py",                # Test files
    "*/conftest.py",            # pytest configuration
    "apps/*/apps.py",           # Django app configuration (no logic)
    "apps/*/admin.py",          # Django admin registration (typically no logic)
    "apps/*/management/commands/*",  # Management commands (tested separately if needed)
    "apps/*/__init__.py",       # Package initialization files
    "apps/__init__.py",         # Root package init
    "scripts/*",                # Utility scripts (not application code)
    "shared/*",                 # Shared utilities (tested via usage)
]

# Parallel mode for pytest-xdist compatibility
parallel = true

[tool.coverage.report]
# Fail when application statement coverage drops below the regression floor.
fail_under = 90

# Precision for coverage percentages
precision = 2

# Skip files with no executable code
skip_empty = true

# Show lines that weren't covered
show_missing = true

# Sort report by coverage percentage (lowest first)
sort = "Cover"

# Exclude lines/patterns from coverage
exclude_lines = [
    "pragma: no cover",         # Explicit coverage exclusion
    "def __repr__",             # String representations (not critical)
    "def __str__",              # String representations (not critical)
    "raise AssertionError",     # Defensive assertions
    "raise NotImplementedError", # Abstract methods
    "if __name__ == .__main__.:", # Script entry points
    "if TYPE_CHECKING:",        # Type checking imports
    "class .*\\bProtocol\\):",  # Protocol definitions
    "@(abc\\.)?abstractmethod", # Abstract methods
]

[tool.coverage.html]
# HTML report directory
directory = "htmlcov"

[tool.coverage.json]
# JSON report file
output = "coverage.json"
