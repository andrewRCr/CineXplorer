[mypy]
# plugins = mypy_django_plugin.main  # Disabled for now

# Python version
python_version = 3.13

# Use strict mode as base, then override specific settings
strict = true

# Make it reasonable for Django development
disallow_untyped_defs = false
warn_return_any = false
disallow_any_decorated = false

# Keep these strict settings enabled
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Show detailed output
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true
color_output = true

# Start with lenient settings for migrations and tests
[mypy-*.migrations.*]
ignore_errors = true

[mypy-*.tests.*]
ignore_errors = true

# Be more strict with our new API client code since it's well-typed
[mypy-apps.core.services.*]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

