---
name: API Type Generation & Validation

on:
  # Run on push to main and PRs
  push:
    branches: [main]
    paths:
      - 'backend/apps/*/api.py'
      - 'backend/apps/*/schemas.py'
      - 'backend/config/api.py'
      - 'frontend/package.json'
      - '.github/workflows/type-generation.yml'
  pull_request:
    paths:
      - 'backend/apps/*/api.py'
      - 'backend/apps/*/schemas.py'
      - 'backend/config/api.py'
      - 'frontend/package.json'
      - '.github/workflows/type-generation.yml'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      export_schema:
        description: 'Export and commit updated OpenAPI schema'
        required: false
        type: boolean
        default: false

jobs:
  generate-types:
    name: Generate & Validate TypeScript Types
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: cinexplorer-backend:type-gen
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Create .env file
        run: |
          echo "POSTGRES_DB=cinexplorer" > backend/config/.env
          echo "POSTGRES_USER=postgres" >> backend/config/.env
          echo "POSTGRES_PASSWORD=postgres" >> backend/config/.env
          echo "DJANGO_SECRET_KEY=ci-secret-key-for-type-generation" >> backend/config/.env
          echo "TMDB_API_KEY=dummy-key-for-type-generation" >> backend/config/.env
          echo "BACKEND_URL=https://localhost:8000" >> backend/config/.env

      - name: Start backend service
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-typegen
        run: |
          # Start services with CI-specific configuration
          echo "Starting services with type generation configuration..."
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml up -d dev-db

          # Wait for database to be ready with proper retry logic
          echo "Waiting for database to be ready..."
          for i in {1..30}; do
            if docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml exec -T dev-db pg_isready -U postgres -d cinexplorer; then
              echo "Database is ready!"
              break
            fi
            echo "Database not ready yet, waiting... ($i/30)"
            sleep 2
          done

          # Start backend service
          echo "Starting backend service..."
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml up -d backend

          # Wait for backend service to start
          echo "Waiting for backend service to start..."
          sleep 5

          # Check backend status and logs if it's not running
          echo "Checking backend container status..."
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml ps backend

          # Check if backend container is running, if not show logs
          if ! docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml ps backend | grep -q "running"; then
            echo "Backend container is not running! Checking logs:"
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml logs backend
            echo "Attempting to restart backend..."
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml restart backend
            sleep 10
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml ps backend
          fi

          # Wait for database and run migrations with retry
          echo "Running database migrations..."
          for i in {1..5}; do
            if docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml exec -T backend python manage.py wait_for_db; then
              echo "Database connection successful, running migrations..."
              docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml exec -T backend python manage.py migrate
              break
            else
              echo "Failed to connect to database, attempt $i/5"
              sleep 5
            fi
          done

          # Wait for Django server to fully start and be ready for API calls
          echo "Waiting for Django server to be ready..."
          for i in {1..15}; do
            if docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml exec -T backend python manage.py check; then
              echo "Django server is ready!"
              break
            elif [ $i -eq 15 ]; then
              echo "Django server failed to start after 15 attempts. Showing logs:"
              docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml logs backend
              exit 1
            else
              echo "Django not ready yet, waiting... ($i/15)"
              sleep 3
            fi
          done

          # Final verification that backend is running
          echo "Final backend status check:"
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml ps backend
          if ! docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml ps backend | grep -q "running"; then
            echo "ERROR: Backend is still not running after all setup steps!"
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml logs backend
            exit 1
          fi

          echo "Backend service is now ready for API calls"

      - name: Export OpenAPI schema
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-typegen
        run: |
          # Verify backend is running
          echo "Checking backend status..."
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml ps backend

          # Export schema from running backend
          echo "Exporting OpenAPI schema..."
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml exec -T backend python -c '
          from config.api import api
          import json
          schema = api.get_openapi_schema()
          print(json.dumps(schema, indent=2))
          ' > frontend/openapi.json

          # Validate export was successful
          if [ ! -f frontend/openapi.json ] || [ ! -s frontend/openapi.json ]; then
            echo "Error: OpenAPI schema export failed or file is empty"
            echo "Backend logs:"
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml logs backend --tail=20
            exit 1
          fi

          echo "OpenAPI schema exported successfully"
          echo "Schema size: $(wc -l frontend/openapi.json | awk '{print $1}') lines"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate TypeScript types from schema
        working-directory: frontend
        run: npm run generate-types:ci

      - name: Validate generated types
        working-directory: frontend
        run: |
          # Check that types were generated
          if [ ! -f src/types/api.ts ]; then
            echo "Error: Type file was not generated"
            exit 1
          fi

          # Validate TypeScript compilation
          npm run validate-types

          # Check type file has expected content
          echo "Generated type file stats:"
          echo "Lines: $(wc -l src/types/api.ts | awk '{print $1}')"
          echo "Paths: $(grep -c '^    "/api/' src/types/api.ts)"
          echo "Schemas: $(grep -c 'Schema:' src/types/api.ts)"

      - name: Type-check with generated types
        working-directory: frontend
        run: npm run type-check

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: frontend/openapi.json
          retention-days: 30

      - name: Upload generated types artifact
        uses: actions/upload-artifact@v4
        with:
          name: typescript-types
          path: frontend/src/types/api.ts
          retention-days: 30

      # Optional: Commit schema updates (manual trigger only)
      - name: Commit schema updates
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.export_schema == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/openapi.json
          git diff --staged --quiet || git commit -m "chore: Update OpenAPI schema [skip ci]"
          git push

      - name: Cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-typegen
        run: |
          echo "Cleaning up Docker resources..."
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.typegen.yml down -v
          # Also clean up any remaining containers with the project name
          docker container ls -aq --filter "name=cinexplorer-typegen" | xargs -r docker rm -f
          docker volume ls -q --filter "name=cinexplorer-typegen" | xargs -r docker volume rm