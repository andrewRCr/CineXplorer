services:
  backend:
    build:
      context: ../backend
      args:
        DEV: "true"
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/backend:cached
      - ../shared:/shared:cached
      - ../backend/logs:/backend/logs:cached
      - ./dev-certs/key.pem:/certs/backend/key.pem:ro
      - ./dev-certs/cert.pem:/certs/backend/cert.pem:ro
    env_file:
      - ../backend/config/.env
    environment:
      - DB_HOST=dev-db
      - BACKEND_CERT_PATH=/certs/backend/cert.pem
      - BACKEND_KEY_PATH=/certs/backend/key.pem
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-k",
          "--fail",
          "https://localhost:8000/api/health-check/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dev-db:
        condition: service_healthy
    # Note: Auto-reload may not work reliably on Windows/Docker due to file watching limitations
    # Use: docker compose restart backend after code changes
    command: sh -c "python manage.py runserver_plus 0.0.0.0:8000 --cert-file $${BACKEND_CERT_PATH} --key-file $${BACKEND_KEY_PATH}"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/frontend:cached
      - ../shared:/shared:cached
      - ../frontend/logs:/frontend/logs:cached
      - frontend-node-modules:/frontend/node_modules
      - ./dev-certs/key.pem:/certs/frontend/key.pem:ro
      - ./dev-certs/cert.pem:/certs/frontend/cert.pem:ro
    environment:
      - HOST=0.0.0.0

    depends_on:
      - backend

  dev-db:
    image: postgres:17.5-alpine
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      # These credentials are for local development only. The backend service connects to its
      # database using credentials from its own .env file, not these.
      - POSTGRES_DB=cinexplorer_dev
      - POSTGRES_USER=cinexplorer_user
      - POSTGRES_PASSWORD=cinexplorer_dev_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinexplorer_user -d cinexplorer_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    ports:
      - "8444:8444"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./dev-certs/cert.pem:/etc/caddy/cert.pem:ro
      - ./dev-certs/key.pem:/etc/caddy/key.pem:ro
      # Mount dev cert as trusted CA for backend TLS verification
      - ./dev-certs/cert.pem:/usr/local/share/ca-certificates/dev-backend.crt:ro
    environment:
      # Trust the dev certificate for backend communication
      - SSL_CERT_FILE=/usr/local/share/ca-certificates/dev-backend.crt
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  dev-db-data:
  frontend-node-modules:
