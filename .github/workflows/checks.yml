---
name: Test / Lint

on: [push]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI environment file
        run: |
          echo "POSTGRES_DB=cinexplorer" > backend/config/.env.ci
          echo "POSTGRES_USER=postgres" >> backend/config/.env.ci
          echo "POSTGRES_PASSWORD=postgres" >> backend/config/.env.ci
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> backend/config/.env.ci
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> backend/config/.env.ci
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> backend/config/.env.ci
      - name: Run Tests and Lint
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-ci
        run: |
          docker compose --env-file backend/config/.env.ci up -d
          docker compose exec backend sh -c "python manage.py wait_for_db && python manage.py test && flake8 --max-line-length=99 --exclude migrations"
          docker compose down
