# Override configuration for type generation CI workflow
# This ensures the backend runs properly for schema export without HTTPS complexity

services:
  backend:
    # Override command to run without HTTPS for CI
    command: python manage.py runserver 0.0.0.0:8000
    # Remove HTTPS-related volumes that might cause issues
    volumes:
      - ../backend:/backend:cached
      - ../shared:/shared:cached
      - ../backend/logs:/backend/logs:cached
    # Remove healthcheck that depends on HTTPS
    healthcheck:
      disable: true
    environment:
      - CI=true
      - DJANGO_DEBUG=true

  dev-db:
    environment:
      - POSTGRES_DB=cinexplorer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres