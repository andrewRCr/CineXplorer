[mypy]
explicit_package_bases = True
# CineXplorer Backend - Hybrid Type Checking Configuration
#
# This configuration implements our hybrid approach:
# - MyPy >=1.13 + django-stubs >=5.2.x for Django-compatible CI validation
# - Relaxed global settings for Django framework compatibility
# - Strict settings for specific modules (services, utilities) where we want maximum type safety
#
# For development: Use Pyright with pyrightconfig.json for fast, modern type checking
# For CI/CD: Use this MyPy configuration with `python type_check.py`
#
# See: backend/type_check.py for comprehensive type checking script

# Enable Django and Pydantic plugins for framework-specific type checking
plugins = mypy_django_plugin.main, pydantic.mypy

# Python version
python_version = 3.12
mypy_path = apps

# Selective strict configuration for Django compatibility
strict = false

# Relaxed professional type checking standards for Django framework
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_decorated = false
disallow_any_generics = false
disallow_any_unimported = false
disallow_any_expr = false
disallow_subclassing_any = false
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

# Enhanced Any tracking for better type safety
# These help identify where Any is being used in our code
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Professional output formatting
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true
color_output = true
error_summary = true

# Performance optimization
cache_fine_grained = true
incremental = true

# Django-specific configuration
[mypy.plugins.django-stubs]
django_settings_module = "config.settings"

# Exclude patterns for auto-generated code and config files
[mypy-*.migrations.*]
ignore_errors = true

[mypy-config.*]
# Config files use relaxed rules due to dynamic patterns but still get basic type checking
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_expr = false
check_untyped_defs = true

[mypy-*.tests.*]
# Enable type checking for tests but allow some flexibility
disallow_untyped_defs = false
check_untyped_defs = true

# Strict settings for our service layer
[mypy-apps.core.services.*]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
disallow_incomplete_defs = true

# Strict settings for our utilities
[mypy-apps.core.utilities.*]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
disallow_incomplete_defs = true

[mypy-apps.movie.services.*]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
disallow_incomplete_defs = true

# Third-party packages without stubs
[mypy-tmdbsimple.*]
ignore_missing_imports = true

[mypy-environ.*]
ignore_missing_imports = true


[mypy-config.logging]
ignore_errors = True

[mypy-config.settings]
ignore_errors = True
