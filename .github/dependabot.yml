---
version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows current: one grouped pull
  # request a month, offering only releases at least a week old
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
