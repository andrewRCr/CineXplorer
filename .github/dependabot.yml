---
version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows current: one grouped pull
  # request a month, offering only releases at least a week old
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directories:
      - /frontend
      - /frontend/tools/api-types
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # TypeScript majors wait for typescript-eslint support; the API type
    # generator must stay on TypeScript 5.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: ci
      include: scope

  # The backend's hashed locks: Dependabot edits the .in files and recompiles
  # the locks with the flags recorded in their headers
  - package-ecosystem: uv
    directory: /backend/requirements
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Keep Django on 5.2 LTS; revisit Django and redis majors after launch.
    ignore:
      - dependency-name: django
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # Keep development-tool majors out of runtime dependency updates.
      python-dev-major:
        patterns: [pytest-cov, django-extensions, django-debug-toolbar]
        update-types: [major]
      python-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: ci
      include: scope
