services:
  backend:
    build:
      context: .
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=devDB
      - DB_USER=devUser
      - DB_PASS=devPassword
    depends_on:
      - db

  db:
    image: postgres:17.5-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devDB
      - POSTGRES_USER=devUser
      - POSTGRES_PASSWORD=devPassword

volumes:
  dev-db-data:
