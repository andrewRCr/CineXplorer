---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            backend/.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: cinexplorer-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and cache backend image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Create .env file
        run: |
          echo "POSTGRES_DB=cinexplorer" > backend/config/.env
          echo "POSTGRES_USER=postgres" >> backend/config/.env
          echo "POSTGRES_PASSWORD=postgres" >> backend/config/.env
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> backend/config/.env
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> backend/config/.env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> backend/config/.env
          echo "ZEPTOMAIL_API_KEY=${{ secrets.ZEPTOMAIL_API_KEY }}" >> backend/config/.env
          # FRONTEND_URL will be added when production domain is available
          # echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend/config/.env

      - name: Start services
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-ci
          CI: true
        run: |
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.ci.yml up -d dev-db backend
          # Wait for database to be ready (with timeout for fast failure)
          docker compose exec -T backend python manage.py wait_for_db --timeout 60

      - name: Run backend tests
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-ci
        run: |
          echo "Running pytest with coverage..."
          docker compose exec -T backend pytest apps/ --cov=apps --cov-report=term --cov-report=xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: backend/.pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('backend/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Run backend lint
        env:
          COMPOSE_PROJECT_NAME: cinexplorer-ci
        run: |
          docker compose exec -T backend ruff check apps/ config/

      - name: Setup Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backend type checking
        run: |
          echo "Running Pyright type checking with django-types..."
          npx pyright backend/apps/ backend/config/ --project backend

  markdown:
    name: Documentation Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint markdown files
        run: |
          npx markdownlint-cli2 "README.md" ".arc/**/*.md"

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate types from schema (if available)
        if: ${{ hashFiles('frontend/openapi.json') != '' }}
        working-directory: frontend
        run: npm run ci:generate-types --if-present

      - name: TypeScript type checking
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build verification
        working-directory: frontend
        run: npm run build
