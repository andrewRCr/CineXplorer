services:
  backend:
    build:
      context: ./backend
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
      - ./certs/key.pem:/app/key.pem
      - ./certs/cert.pem:/app/cert.pem
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver_plus 0.0.0.0:8000 --cert-file /app/cert.pem --key-file /app/key.pem"
    environment:
      - DB_HOST=db
      - DB_NAME=devDB
      - DB_USER=devUser
      - DB_PASS=devPassword
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/frontend/src # bind local source files to container (without node_modules)
      - ./certs/key.pem:/app/certs/key.pem
      - ./certs/cert.pem:/app/certs/cert.pem

    depends_on:
      - backend

  db:
    image: postgres:17.5-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devDB
      - POSTGRES_USER=devUser
      - POSTGRES_PASSWORD=devPassword

  caddy:
    image: caddy:latest
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs/cert.pem:/etc/caddy/cert.pem
      - ./certs/key.pem:/etc/caddy/key.pem
    depends_on:
      - backend
      - frontend

volumes:
  dev-db-data:
