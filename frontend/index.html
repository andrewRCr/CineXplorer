<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CineXplorer</title>
		<style>
			html, body { margin: 0; }
			#root { min-height: 100vh; }
		</style>
		<script>
			// Prevent flash of wrong background before React/Chakra loads
			// Reads background color stored by BackgroundSync component
			(function() {
				var bg = '#161616'; // Default: IBM Carbon dark
				try { bg = localStorage.getItem('cinexplorer-bg') || bg; } catch(e) {}
				document.documentElement.style.backgroundColor = bg;
			})();
		</script>
	</head>
	<body>
		<div id="root">
			<div
				style="
					display: flex;
					justify-content: center;
					align-items: center;
					height: 100vh;
				"
			></div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
