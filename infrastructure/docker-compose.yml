services:
  backend:
    build:
      context: ../backend
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - ..:/workspaces:cached
      - ./dev-certs/key.pem:/app/key.pem
      - ./dev-certs/cert.pem:/app/cert.pem
    env_file:
      - ../backend/config/.env
    environment:
      - DB_HOST=dev-db
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-k",
          "--fail",
          "https://localhost:8000/api/health-check/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dev-db:
        condition: service_healthy
    command: python manage.py runserver_plus 0.0.0.0:8000 --cert-file /app/cert.pem --key-file /app/key.pem

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ..:/workspaces:cached
      - frontend-node-modules:/frontend/node_modules
      - ./dev-certs/key.pem:/app/certs/key.pem
      - ./dev-certs/cert.pem:/app/certs/cert.pem

    depends_on:
      - backend

  dev-db:
    image: postgres:17.5-alpine
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      # These credentials are for local development only. The backend service connects to its
      # database using credentials from its own .env file, not these.
      - POSTGRES_DB=devDB
      - POSTGRES_USER=devUser
      - POSTGRES_PASSWORD=devPassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devUser -d devDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    ports:
      - "8444:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./dev-certs/cert.pem:/etc/caddy/cert.pem
      - ./dev-certs/key.pem:/etc/caddy/key.pem
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  dev-db-data:
  frontend-node-modules:
