---
name: CI

on:
  push:
    branches: [main]
  # Every base, so stacked pull requests into feature branches get CI too
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes its running checks; runs on main all finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: infrastructure/docker-compose.yml:infrastructure/docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: cinexplorer-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: dev
          build-args: |
            USER_UID=1000
            USER_GID=1000
          tags: cinexplorer-backend-dev:ci
          load: true
          push: false
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max

      - name: Create .env file
        run: |
          {
            echo "POSTGRES_DB=cinexplorer"
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            # Dummy values: tests mock TMDB and use the locmem email backend
            echo "DJANGO_SECRET_KEY=ci-secret-key-not-for-production"
            echo "TMDB_API_KEY=dummy-key-for-ci"
            echo "BACKEND_URL=https://localhost:8000"
            echo "ZEPTOMAIL_API_KEY=dummy-key-for-ci"
          } > backend/config/.env

      - name: Start services
        env:
          CI: true
        run: |
          docker compose up -d --quiet-pull --no-build dev-db backend
          # Wait for database to be ready (with timeout for fast failure)
          docker compose exec -T backend python manage.py wait_for_db --timeout 60

      - name: Check for missing migrations
        run: |
          docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: |
          echo "Running pytest with coverage..."
          docker compose exec -T -e COVERAGE_FILE=/tmp/.coverage backend pytest apps/ -p no:cacheprovider --cov=apps --cov-report=term --cov-report=xml:/tmp/coverage.xml

          # Copy coverage report from container to host
          docker compose cp backend:/tmp/coverage.xml backend/coverage.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install Python dependencies
        run: |
          python -m venv .venv-backend
          .venv-backend/bin/pip install -q --upgrade pip
          .venv-backend/bin/pip install -q -r backend/requirements/req.dev.txt

      - name: Check the dependency locks match their inputs
        # Hash-only changes are ignored: a package can publish new files for a version it
        # already released. Installs still check every hash.
        run: |
          PATH="$PWD/.venv-backend/bin:$PATH" backend/requirements/lock.sh
          git diff --exit-code -I '^[[:space:]]*(#|--hash=)' -- backend/requirements/

      - name: Audit the dependency locks
        run: |
          .venv-backend/bin/pip-audit --require-hashes --disable-pip \
            -r backend/requirements/req.prod.txt -r backend/requirements/req.dev.txt

      - name: Run backend lint
        run: .venv-backend/bin/ruff check backend/apps/ backend/config/

      - name: Check backend formatting
        run: .venv-backend/bin/ruff format --check backend/

      - name: Setup Node.js for Pyright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Run backend type checking
        run: |
          echo "Running Pyright type checking with django-types..."
          npx pyright@1.1.414 backend/apps/ backend/config/ --project backend --warnings

  images:
    name: Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/andrewrcr/cinexplorer-backend
          flavor: latest=false
          tags: |
            type=sha
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/andrewrcr/cinexplorer-web
          flavor: latest=false
          tags: |
            type=sha
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build backend production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: production
          tags: cinexplorer-backend:ci
          load: true
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Check backend image size
        run: |
          image_bytes="$(docker run --rm --user root --entrypoint sh cinexplorer-backend:ci -c 'du -sxb /' | awk '{print $1}')"
          echo "Backend image filesystem: $image_bytes bytes"
          test "$image_bytes" -lt 300000000

      - name: Check backend deployment settings
        run: |
          secret_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          docker run --rm \
            -e ENVIRONMENT=production \
            -e DJANGO_SECRET_KEY="$secret_key" \
            -e TMDB_API_KEY=placeholder \
            -e BACKEND_URL=https://placeholder.invalid \
            -e POSTGRES_DB=placeholder \
            -e POSTGRES_USER=placeholder \
            -e POSTGRES_PASSWORD=placeholder \
            -e DJANGO_ALLOWED_HOSTS=placeholder.invalid \
            cinexplorer-backend:ci python manage.py check --deploy --fail-level WARNING

      - name: Build web production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          target: production
          build-contexts: infra=./infrastructure
          tags: cinexplorer-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend production image
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: production
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=backend

      - name: Publish web production image
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          target: production
          build-contexts: infra=./infrastructure
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=web

  markdown:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Test session hooks
        run: >-
          node --test .arc/reference/harness-hooks/compaction-recovery.test.mjs
          .arc/reference/harness-hooks/seed-session-notes.test.mjs
          scripts/worktree.test.mjs

      - name: Lint markdown files
        run: |
          npx markdownlint-cli2@0.24.0 "README.md" ".arc/**/*.md"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Generate types from schema (if available)
        if: ${{ hashFiles('frontend/openapi.json') != '' }}
        run: npm run generate-types:ci

      - name: Generate Chakra UI component types
        run: npm run typegen

      - name: TypeScript type checking
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Verify theme contrast (WCAG AA compliance)
        run: npm run verify-contrast:ci

      - name: Run frontend tests
        run: npm run test:coverage -- --reporter=default --coverage.reporter=text --coverage.reporter=json-summary

      - name: Upload frontend coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 30

      - name: Build verification
        run: npm run build

  type-generation:
    name: API types
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: infrastructure/docker-compose.yml:infrastructure/docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: cinexplorer-typegen-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: dev
          build-args: |
            USER_UID=1000
            USER_GID=1000
          tags: cinexplorer-backend-dev:ci
          load: true
          push: false
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max

      - name: Create .env file
        run: |
          {
            echo "POSTGRES_DB=cinexplorer"
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            echo "DJANGO_SECRET_KEY=ci-secret-key-for-type-generation"
            echo "TMDB_API_KEY=dummy-key-for-type-generation"
            echo "ZEPTOMAIL_API_KEY=dummy-key-for-ci"
            echo "BACKEND_URL=https://localhost:8000"
          } > backend/config/.env

      - name: Start backend service
        run: |
          # Same CI configuration as the backend job
          echo "Starting services with standard CI configuration..."
          docker compose up -d --quiet-pull --no-build dev-db backend

          # Wait for database and run migrations with retry logic for transient failures
          echo "Waiting for database and running migrations..."

          # Retry wait_for_db command (up to 5 attempts with backoff)
          for i in {1..5}; do
            if docker compose exec -T backend python manage.py wait_for_db; then
              echo "Database ready on attempt $i"
              break
            else
              if [ "$i" -eq 5 ]; then
                echo "Failed to connect to database after 5 attempts"
                exit 1
              fi
              echo "Database not ready, retrying in $((i * 2)) seconds... (attempt $i/5)"
              sleep $((i * 2))
            fi
          done

          # Retry migrate command (up to 5 attempts with backoff)
          for i in {1..5}; do
            if docker compose exec -T backend python manage.py migrate; then
              echo "Migrations completed on attempt $i"
              break
            else
              if [ "$i" -eq 5 ]; then
                echo "Failed to run migrations after 5 attempts"
                exit 1
              fi
              echo "Migration failed, retrying in $((i * 2)) seconds... (attempt $i/5)"
              sleep $((i * 2))
            fi
          done

          echo "Backend service is now ready for API calls"

      - name: Export OpenAPI schema
        run: |
          # Export schema directly to final location (command output is now clean)
          echo "Exporting OpenAPI schema..."
          docker compose exec -T backend python manage.py export_openapi_schema > frontend/openapi.json

          # Validate export was successful
          if [ ! -f frontend/openapi.json ] || [ ! -s frontend/openapi.json ]; then
            echo "Error: OpenAPI schema export failed or file is empty"
            echo "Backend logs:"
            docker compose logs backend --tail=20
            exit 1
          fi

          echo "OpenAPI schema exported successfully"
          echo "Schema size: $(wc -l frontend/openapi.json | awk '{print $1}') lines"

          # Validate JSON structure
          if ! python3 -m json.tool frontend/openapi.json > /dev/null 2>&1; then
            echo "Error: Generated openapi.json is not valid JSON"
            echo "First 50 lines of openapi.json:"
            head -50 frontend/openapi.json
            echo ""
            echo "Last 50 lines of openapi.json:"
            tail -50 frontend/openapi.json
            exit 1
          fi

          echo "JSON validation passed"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate TypeScript types from schema
        working-directory: frontend
        run: npm run generate-types:ci

      - name: Validate generated types
        working-directory: frontend
        run: |
          # Check that types were generated
          if [ ! -f src/types/api.ts ]; then
            echo "Error: Type file was not generated"
            exit 1
          fi

          # Validate TypeScript compilation
          npm run validate-generated-types

          # Check type file has expected content
          echo "Generated type file stats:"
          echo "Lines: $(wc -l src/types/api.ts | awk '{print $1}')"
          echo "Paths: $(grep -c '^    "/api/' src/types/api.ts)"
          echo "Schemas: $(grep -c 'Schema:' src/types/api.ts)"

      - name: Generate Chakra UI component types
        working-directory: frontend
        # Note: Chakra typegen outputs to node_modules/@chakra-ui/react/dist/types/
        # (not committed). No drift detection needed - types are ephemeral and
        # regenerated each CI run. The subsequent type-check validates correctness.
        run: npm run typegen

      - name: Type-check with generated types
        working-directory: frontend
        run: npm run type-check

      - name: Check for type drift
        working-directory: frontend
        run: |
          # Detect if generated types differ from committed version
          if ! git diff --exit-code src/types/api.ts; then
            echo "❌ ERROR: Generated types have drifted from committed version"
            echo ""
            echo "The generated src/types/api.ts differs from the version in git."
            echo "This indicates the OpenAPI schema has changed without updating committed types."
            echo ""
            echo "To fix:"
            echo "  1. Run: npm run generate-types"
            echo "  2. Review the changes in src/types/api.ts"
            echo "  3. Commit both openapi.json and src/types/api.ts"
            exit 1
          fi
          echo "✅ Generated types match committed version (no drift detected)"

      - name: Upload schema artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-schema
          path: frontend/openapi.json
          retention-days: 30

      - name: Upload generated types artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: typescript-types
          path: frontend/src/types/api.ts
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up Docker resources..."
          docker compose down -v
          # Also clean up any remaining containers with the project name
          docker container ls -aq --filter "name=cinexplorer-typegen-${{ github.run_id }}" | xargs -r docker rm -f
          docker volume ls -q --filter "name=cinexplorer-typegen-${{ github.run_id }}" | xargs -r docker volume rm

  # The one required check: passes only when every job above succeeded
  ci-ok:
    name: ci-ok
    needs: [backend, backend-checks, images, markdown, frontend, type-generation]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Roll up required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key')"
          if [ -n "$failed" ]; then
            echo "::error::required job(s) did not succeed: $(printf '%s' "$failed" | paste -sd, -)"
            exit 1
          fi
