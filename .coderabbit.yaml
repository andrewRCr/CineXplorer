# CodeRabbit Configuration for CineXplorer
# https://docs.coderabbit.ai/reference/configuration
#
# Repository settings; organization or workspace global overrides take precedence.

# Review configuration
reviews:
  # Keep authored descriptions and walkthroughs free of generated PR summaries.
  high_level_summary: false
  high_level_summary_in_walkthrough: false

  # Code quality focus areas - ignore build artifacts and dependencies
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.venv*/**"
    - "!**/logs/**"

  # Review is requested per pull request (comment `@coderabbitai review`); every
  # automatic path is pinned off so an account-level default cannot re-enable one.
  auto_review:
    enabled: false
    labels: []
    drafts: false
    auto_incremental_review: false
    description_keyword: ""

  # No status message (such as "review skipped") on pull requests nobody asked to review
  review_status: false

  pre_merge_checks:
    docstrings:
      mode: "off"

# Knowledge base - organizational learning and coding standards
knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - ".arc/reference/constitution/DEVELOPMENT-RULES.md"
      - ".arc/reference/constitution/TECHNICAL-OVERVIEW.md"
      - ".arc/reference/strategies/**/*.md"
      - ".arc/reference/adr/**/*.md"
  learnings:
    scope: auto
  issues:
    scope: auto
