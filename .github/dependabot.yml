---
version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows current: one grouped pull
  # request a month, offering only releases at least a week old
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directories:
      - /frontend
      - /frontend/tools/api-types
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: ci
      include: scope

  # The backend's hashed locks: Dependabot edits the .in files and recompiles
  # the locks with the flags recorded in their headers
  - package-ecosystem: uv
    directory: /backend/requirements
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: ci
      include: scope
