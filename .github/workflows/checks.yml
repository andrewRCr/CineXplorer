---
name: Test / Lint

on: [push]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: docker compose run --env DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }} --env TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --rm backend sh -c "python manage.py wait_for_db && python manage.py test"
      - name: Lint with flake8
        run: docker compose run --rm backend sh -c "flake8 --max-line-length=99 --exclude migrations"
