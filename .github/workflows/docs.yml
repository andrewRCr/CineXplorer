---
name: Docs

on:
  workflow_call:
  push:
    branches: [main]
    paths: [".arc/**"]

permissions:
  contents: read

jobs:
  markdown:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Test session hooks
        run: >-
          node --test .arc/reference/harness-hooks/compaction-recovery.test.mjs
          .arc/reference/harness-hooks/seed-session-notes.test.mjs
          .arc/reference/harness-hooks/finish-work.test.mjs
          scripts/worktree.test.mjs

      - name: Lint markdown files
        run: |
          npx markdownlint-cli2@0.24.0 "README.md" ".arc/**/*.md"

